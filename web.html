<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Wa 💖</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@200;400;500&family=Caveat:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-pink: #ffb3c1;
            --soft-red: #ff4d6d;
            --bg-color: #fffafb;
        }

        body {
            margin: 0; padding: 0;
            background-color: var(--bg-color);
            font-family: 'Kanit', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            color: #594d4d;
        }

        /* หน้าแรกสำหรับกดเริ่มเพื่ออนุญาตให้เพลงเล่น */
        #start-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-color);
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .heart-fall {
            position: absolute; top: -10%;
            user-select: none; pointer-events: none;
            animation: fall linear forwards;
        }

        @keyframes fall { to { transform: translateY(110vh) rotate(360deg); } }

        .container { text-align: center; z-index: 10; padding: 20px; }

        #memory-box { min-height: 150px; display: flex; flex-direction: column; justify-content: center; align-items: center; }

        .memory-text {
            font-size: 1.5rem; font-weight: 400; line-height: 1.6;
            opacity: 0; transform: translateY(20px);
            transition: all 1s ease-in-out;
            color: #ff4d6d;
        }

        .memory-text.active { opacity: 1; transform: translateY(0); }

        .special-font { font-family: 'Caveat', cursive; font-size: 2.5rem; color: #ff758c; }

        #final-action { margin-top: 30px; display: none; animation: fadeIn 2s ease-in forwards; }

        .btn-love {
            background-color: var(--soft-red);
            color: white; border: none; padding: 12px 30px;
            border-radius: 50px; font-size: 1.1rem;
            cursor: pointer; box-shadow: 0 4px 15px rgba(255, 77, 109, 0.3);
            transition: 0.3s; text-decoration: none;
        }

        .btn-love:hover { transform: scale(1.1); background-color: #ff758c; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* แก้ไข 1: ซ่อน YouTube แบบให้มีขนาด 1px มือถือจะได้ไม่บล็อกเสียง */
        #player { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; top: -100px; }
    </style>
</head>
<body>

    <div id="start-overlay">
        <h2 style="color: #ff4d6d;">มีเซอร์ไพรส์ให้วาครับ 💖</h2>
        <button class="btn-love" onclick="startSurprise()">กดดูตรงนี้เลย</button>
    </div>

    <div id="player"></div>

    <div class="container">
        <div id="memory-box">
            <p id="display-text" class="memory-text"></p>
        </div>
        
        <div id="final-action">
            <p style="margin-bottom: 20px;">วันนี้เป็นวันที่ดีที่สุดเลย ขอบคุณนะวา</p>
            <button class="btn-love" onclick="alert('รักกที่สูดดดดดดดดดดดดดดดดดดดดดดดดดด 💖'); window.close(); window.location.href='instagram://';">รักมากๆเลยนะคับ 💖</button>
        </div>
    </div>

    <script>
        // โหลด YouTube API
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        var player;
        function onYouTubeIframeAPIReady() {
            // แก้ไข 2: เพิ่มการตั้งค่าเพื่อรองรับมือถือ
            player = new YT.Player('player', {
                height: '1',
                width: '1',
                videoId: 'mGUjVbsYG6E', 
                playerVars: {
                    'autoplay': 0,
                    'controls': 0,
                    'showinfo': 0,
                    'rel': 0,
                    'loop': 1,
                    'playsinline': 1, // ป้องกันการเด้งเต็มจอใน iOS
                    'playlist': 'mGUjVbsYG6E' // บังคับให้วนลูป
                },
                events: {
                    'onReady': onPlayerReady
                }
            });
        }

        function onPlayerReady(event) {
            // พร้อมเล่นเพลง
        }

        function startSurprise() {
            // ซ่อนหน้า Overlay และเริ่มเล่นเพลง + ข้อความ
            document.getElementById('start-overlay').style.display = 'none';
            if (player && typeof player.playVideo === 'function') {
                // แก้ไข 3: บังคับเปิดเสียงและเร่งเสียงเต็มที่
                player.unMute();
                player.setVolume(100);
                player.playVideo();
            }
            showMemories();
            setInterval(createHeart, 300);
        }

        const memories = [
            "วาครับ...",
            "วันนี้เป็นวันที่ดีจังเลยนะ",
            "ขอบคุณนะที่วาเลนไทน์ปีนี้มีวาอยู่ข้างๆ",
            "ถึงจะอยู่ไกลกัน แต่ผมจำได้ทุกความทรงจำเลยนะ",
            "ขอบคุณที่ยังอยู่ด้วยกันในทุกๆวันนะ",
            "ผมอยากเป็นรอยยิ้มให้วาในทุกๆ วันเลยยยย",
            "ไม่อยากให้วาต้องเศร้าหรืออารมณ์เสียกับอะไรอีกเลย",
            "อยู่เป็นความสุขของกันและกันแบบนี้ไปนานๆ นะ",
            "<span class='special-font'>I love you, Wa.</span>"
        ];

        let currentIndex = 0;
        const textElement = document.getElementById('display-text');
        const finalAction = document.getElementById('final-action');

        function showMemories() {
            if (currentIndex < memories.length) {
                textElement.classList.remove('active');
                setTimeout(() => {
                    textElement.innerHTML = memories[currentIndex];
                    textElement.classList.add('active');
                    currentIndex++;
                    setTimeout(showMemories, 3500); // ความเร็วในการเปลี่ยนข้อความ
                }, 1000);
            } else {
                finalAction.style.display = 'block';
            }
        }

        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart-fall');
            heart.innerHTML = '🌸';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 3 + 2 + 's';
            heart.style.opacity = Math.random();
            heart.style.fontSize = Math.random() * 20 + 10 + 'px';
            document.body.appendChild(heart);
            setTimeout(() => { heart.remove(); }, 5000);
        }
    </script>
</body>
</html>
